name: CI
on:
  # Manual only (Actions tab -> Run workflow). Add push/pull_request back to run on every push.
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/pekf-slam-icp
      - name: Dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Test (algorithm, no simulator)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --packages-select pekf_slam_icp --event-handlers console_direct+
          colcon test-result --verbose
